name: release

on:
  push:
    branches:
      - main
    paths:
      - CHANGELOG.md

permissions:
  contents: read

concurrency:
  group: release

jobs:
  release:
    name: Create release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Find latest version
        id: version
        run: echo "version=$(bin/changelog latest)" >> "$GITHUB_OUTPUT"

      - name: Create release
        if: ${{ steps.version.outputs.version != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.version.outputs.version }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "$TAG is already released."
            exit 0
          fi

          bin/changelog notes "${TAG#v}" > "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md"

  stage:
    name: Stage on npm
    needs: release
    if: ${{ needs.release.outputs.version != '' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Staged publishing needs npm 11.15.0 or later.
      - name: Update npm
        run: npm install --global npm@11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test
        run: bun run test

      - name: Stage
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          name=$(node -p 'require("./package.json").name')

          if npm view "$name@$VERSION" version > /dev/null 2>&1; then
            echo "$name@$VERSION is already on npm."
            exit 0
          fi

          npm stage publish --provenance
          echo "Approve $name@$VERSION in the Staged Packages tab on npmjs.com, or with \`npm stage approve <stage-id>\`." >> "$GITHUB_STEP_SUMMARY"
